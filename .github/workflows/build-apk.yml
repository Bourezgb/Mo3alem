name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: |
          flutter create --platforms=android --org com.bourezg --project-name mo3alem_nihad .
          rm -f test/widget_test.dart

      - name: Use Gradle distribution mirror
        run: |
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Set minSdk for secure storage
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mo3alem-nihad-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
